<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>الديزل ايفون</title>
    <link rel="icon" href="8888ii.svg" type="image/svg+xml">
    <!-- Google Fonts: Cairo (حديثة وواضحة) + sans-serif احتياطي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (أيقونات احترافية) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000; /* أسود عميق */
            font-family: 'Cairo', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* تدرج ذهبي خفيف للخلفيات / اللمسات */
        .gold-gradient-bg {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.12) 0%, rgba(212, 175, 55, 0.02) 100%);
        }

        /* أنيميشن خفيف عند فتح الصفحة */
        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-entry {
            animation: fadeSlideUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }

        /* تأخيرات بسيطة لجعل الدخول أنيقاً */
        .delay-1 { animation-delay: 0.05s; opacity: 0; }
        .delay-2 { animation-delay: 0.15s; opacity: 0; }
        .delay-3 { animation-delay: 0.25s; opacity: 0; }
        .delay-4 { animation-delay: 0.35s; opacity: 0; }
        .delay-5 { animation-delay: 0.45s; opacity: 0; }

        /* الحاوية الرئيسية */
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 1.2rem 1.2rem 2rem;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header */
        .logo-header {
            text-align: center;
            margin-bottom: 1.8rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(1px);
            border-radius: 48px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,175,55,0.15);
        }

        .logo {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFFFFF 20%, #D4AF37 70%, #F9E28C 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: inline-block;
        }

        .tagline {
            font-size: 0.8rem;
            color: #D4AF37;
            font-weight: 400;
            background: rgba(212,175,55,0.12);
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            margin-top: 0.4rem;
            backdrop-filter: blur(2px);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 2rem 0.5rem;
            margin: 0.5rem 0 1rem;
            background: radial-gradient(ellipse at 50% 30%, rgba(212,175,55,0.08) 0%, rgba(0,0,0,0) 70%);
            border-radius: 48px;
            position: relative;
            overflow: hidden;
        }

        /* عناصر ذهبية متحركة subtle glow */
        .glow-orb {
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(212,175,55,0.25) 0%, rgba(212,175,55,0) 70%);
            border-radius: 50%;
            top: -50px;
            left: -30px;
            filter: blur(40px);
            opacity: 0.5;
            animation: floatGlow 10s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .glow-orb-2 {
            position: absolute;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(212,175,55,0.18) 0%, rgba(212,175,55,0) 70%);
            border-radius: 50%;
            bottom: -70px;
            right: -40px;
            filter: blur(50px);
            opacity: 0.5;
            animation: floatGlow 12s infinite alternate-reverse ease-in-out;
            pointer-events: none;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(15px, 15px) scale(1.2); opacity: 0.6; }
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to left, #FFFFFF, #D4AF37, #F7E05E);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.75rem;
            letter-spacing: -0.3px;
        }

        .hero p {
            font-size: 1rem;
            color: #e0e0e0;
            font-weight: 400;
            max-width: 85%;
            margin: 0 auto;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(2px);
            padding: 0.5rem 1rem;
            border-radius: 60px;
            display: inline-block;
            border: 0.5px solid rgba(212,175,55,0.3);
        }

        /* Social Icons Grid - أنيق Glass effect */
        .social-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem;
            margin: 2rem 0 1.5rem;
        }

        .social-card {
            background: rgba(20, 20, 25, 0.75);
            backdrop-filter: blur(8px);
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 8px 16px -6px rgba(0,0,0,0.6);
            cursor: pointer;
            text-decoration: none;
            color: #fff;
        }

        .social-card i {
            font-size: 2.2rem;
            transition: transform 0.2s, color 0.2s;
            color: #e5e5e5;
        }

        /* تأثير hover ذهبي */
        .social-card:hover {
            background: #D4AF37;
            border-color: #D4AF37;
            transform: translateY(-6px);
            box-shadow: 0 12px 20px -8px rgba(212,175,55,0.5);
        }

        .social-card:hover i {
            color: #000000;
            transform: scale(1.05);
        }

        /* Hashtag Box مميز مع تأثير نيون خفيف */
        .hashtag-section {
            text-align: center;
            margin: 1.2rem 0 1.8rem;
        }

        .hashtag-box {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 1.5px solid #D4AF37;
            border-radius: 60px;
            padding: 0.9rem 1rem;
            display: inline-block;
            width: auto;
            max-width: 100%;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: all 0.3s;
        }

        .hashtag-box:hover {
            box-shadow: 0 0 22px rgba(212, 175, 55, 0.7);
            border-color: #f5e094;
        }

        .hashtag-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #D4AF37;
            letter-spacing: 0.5px;
            word-break: keep-all;
            white-space: nowrap;
            display: inline-block;
        }

        /* Responsive: إذا ضاق العرض يصبح الهاشتاج في سطرين لكنه يظل جميل */
        @media (max-width: 480px) {
            .hashtag-text {
                font-size: 1rem;
                white-space: normal;
                word-break: break-word;
            }
            .hashtag-box {
                padding: 0.7rem 1.2rem;
            }
            .hero h1 {
                font-size: 1.8rem;
            }
            .social-card {
                width: 64px;
                height: 64px;
            }
            .social-card i {
                font-size: 1.9rem;
            }
        }

        /* Floating WhatsApp Button */
        .floating-wa {
            position: fixed;
            bottom: 24px;
            left: 20px;
            background-color: #25D366;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4), 0 0 0 2px rgba(212,175,55,0.3);
            transition: all 0.25s;
            z-index: 1000;
            text-decoration: none;
        }

        .floating-wa i {
            font-size: 2rem;
            color: white;
        }

        .floating-wa:hover {
            transform: scale(1.08);
            background-color: #20b359;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 3px #D4AF37;
        }

        /* Optional: زر اتصال الآن يمكن وضعه في الفوتر أو hero، لكن سنضيفه كزر منفصل انيق في منتصف الصفحة (اختياري) */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1rem 0 1rem;
        }

        .btn-gold {
            background: transparent;
            border: 1.5px solid #D4AF37;
            padding: 0.7rem 1.6rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #D4AF37;
            transition: 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }

        .btn-gold i {
            font-size: 1rem;
        }

        .btn-gold:hover {
            background: #D4AF37;
            color: #000;
            box-shadow: 0 4px 12px rgba(212,175,55,0.4);
            border-color: #D4AF37;
            transform: translateY(-2px);
        }

        .btn-solid-gold {
            background: #D4AF37;
            color: #000;
            border: none;
        }

        .btn-solid-gold:hover {
            background: #f3cd60;
            color: #000;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(212, 175, 55, 0.25);
            font-size: 0.75rem;
            color: #b8b8b8;
        }

        .footer p {
            margin: 0.2rem 0;
        }

        .footer .brand-footer {
            font-weight: 700;
            color: #D4AF37;
            letter-spacing: 0.5px;
        }

        /* عام */
        a {
            text-decoration: none;
        }

        /* ضبط المسافات للهواتف الصغيرة جداً */
        @media (max-width: 380px) {
            .container {
                padding: 0.9rem;
            }
            .hero h1 {
                font-size: 1.6rem;
            }
        }

        /* تأثير لمعان ذهبي للعناصر الأساسية */
        .gold-shadow {
            transition: box-shadow 0.2s;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header class="logo-header animate-entry delay-1">
        <img src="8888ii.svg" alt="الديزل ايفون" class="logo" style="width: 180px; height: auto;">
    </header>

    <!-- Hero Section مع خلفية وعناصر ذهبية متحركة -->
    <div class="hero animate-entry delay-2">

    <!-- قسم روابط السوشيال ميديا Glass effect + أيقونات كبيرة (تم تحديث الروابط) -->
    <div class="social-grid animate-entry delay-3">
        <!-- Facebook (تم التحديث) -->

        </a>
        <!-- TikTok (تم التحديث) -->
        <a href="https://www.tiktok.com/@dezl702537?_r=1&_t=ZS-95GwnlHlOFR" target="_blank" rel="noopener noreferrer" class="social-card" aria-label="تيك توك">
            <i class="fab fa-tiktok"></i>
        </a>
        <!-- Instagram (تم التحديث) -->
        <a href="https://www.instagram.com/moohamedahmeed5?igsh=NDZvZW90MnA2bnBy" target="_blank" rel="noopener noreferrer" class="social-card" aria-label="انستغرام">
            <i class="fab fa-instagram"></i>
        </a>
        <!-- WhatsApp (تم تحديث الرقم) -->
        <a href="https://wa.me/201018104121?text=مرحباً%20أريد%20الاستفسار%20عن%20أحدث%20أجهزة%20الآيفون" target="_blank" rel="noopener noreferrer" class="social-card" aria-label="واتساب">

        </a>

    <!-- أزرار اختيارية (اتصل الآن / راسلنا واتساب) تم تحديث رقم الواتساب والاتصال -->
    <div class="action-buttons animate-entry delay-4">
        <!-- زر الاتصال الآن: يقوم بفتح لوحة الاتصال مباشرة بالرقم 01018104121 -->
        <a href="tel:+201018104121" class="btn-gold"><i class="fas fa-phone-alt"></i> اتصل الآن</a>

    </div>

    <!-- قسم الهاشتاج البارز مع تأثير نيون / ذهبي -->
    <div class="hashtag-section animate-entry delay-5">
        <div class="hashtag-box">
            <span class="hashtag-text">#عايز_ايفون_روح_للديزل_ايفون🥇</span>

    <!-- Footer بسيط وأنيق -->
    <footer class="footer">
        <p><span class="brand-footer">الديزل ايفون</span> © 2026 | جميع الحقوق محفوظة</p>
        <p style="font-size: 0.7rem;">ايفون الشعراوي</p>
    </footer>
</div>

<!-- Floating WhatsApp Button (تم تحديث الرقم) -->
<a href="https://wa.me/201018104121?text=مرحباً%20،%20أريد%20شراء%20أحدث%20آيفون%20من%20الديزل%20ايفون" target="_blank" class="floating-wa" aria-label="راسلنا واتساب">
    <i class="fab fa-whatsapp"></i>
</a>

<script>
    (function() {
        // تذكير بتحديث الروابط والأرقام بشكل نهائي
        console.log("✅ تم تحديث الروابط: فيسبوك، تيك توك، انستجرام، واتساب برقم 01018104121، وزر الاتصال المباشر يعمل");

        // تأثير إضافي: إضافة أنيميشن خفيف جداً عند الضغط على أي زر (تأثير ارتداد)
        const allButtons = document.querySelectorAll('.social-card, .btn-gold, .floating-wa');
        allButtons.forEach(btn => {
            btn.addEventListener('click', function(e) {
                // لا نمنع الحدث، فقط نضيف تأثيراً بصرياً سريعاً
                this.style.transform = 'scale(0.97)';
                setTimeout(() => {
                    if (this.style.transform) this.style.transform = '';
                }, 120);
            });
        });
        
        // جعل الهاشتاج قابل للنقر لنسخ النص
        const hashtagDiv = document.querySelector('.hashtag-box');
        if (hashtagDiv) {
            hashtagDiv.style.cursor = 'pointer';
            hashtagDiv.addEventListener('click', () => {
                const hashtagText = document.querySelector('.hashtag-text')?.innerText;
                if (hashtagText && navigator.clipboard) {
                    navigator.clipboard.writeText(hashtagText).then(() => {
                        const originalBoxShadow = hashtagDiv.style.boxShadow;
                        hashtagDiv.style.transition = '0.1s';
                        hashtagDiv.style.boxShadow = '0 0 20px #D4AF37';
                        setTimeout(() => {
                            hashtagDiv.style.boxShadow = originalBoxShadow;
                        }, 200);
                    }).catch(() => {});
                } else {
                    alert("🥇 #عايز_ايفون_روح_للديزل_ايفون");
                }
            });
        }
    })();
</script>

</body>
</html>
